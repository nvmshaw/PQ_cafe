<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create Account - Sign Up Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css?family=Inter:400,600|Poppins:500,400" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.453.0/lucide.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="background-wrapper">
       
        <div class="background-elements">
          <div class="background-vectors">
            <img class="vector-1" alt="Vector" src="templates/vector1.svg/" />
            <img class="vector-2" alt="Vector" src="templates/vector2.svg" />
          </div>
          
          <div class="logo">logo</div>
        </div>

        <!-- Sign up card -->
        <div class="signup-card">
          <div class="card-content">
            <!-- Header section -->
            <div class="header-section">
              <div class="avatar"></div>
              <h1 class="title">Create an account</h1>
              <p class="subtitle">
                Already have an account? 
                <span class="sign-in-link">Sign in</span>
              </p>
            </div>

            <!-- Form section -->
            <div class="form-section">
              <!-- Form fields -->
              <div class="form-field">
                <div class="field-header">
                  <label class="field-label">Name</label>
                </div>
                <input type="text" class="field-input" />
              </div>

              <div class="form-field">
                <div class="field-header">
                  <label class="field-label">Email</label>
                </div>
                <input type="email" class="field-input" />
              </div>

              <div class="form-field">
                <div class="field-header">
                  <label class="field-label">Password</label>
                  <div class="hide-option">
                    <svg class="eye-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                      <line x1="2" y1="2" x2="22" y2="22"/>
                    </svg>
                    <span class="hide-text">Hide</span>
                  </div>
                </div>
                <input type="password" class="field-input" />
              </div>

              <!-- Terms checkbox -->
              <div class="terms-section">
                <input type="checkbox" id="terms" class="checkbox" />
                <label for="terms" class="terms-label">
                  By creating an account, I agree to our 
                  <span class="terms-link">Terms of use</span> and<br />
                  <span class="terms-link">Privacy Policy</span>
                </label>
              </div>

              <!-- Login button -->
              <button class="login-button" disabled>
                Log in
              </button>
            </div>

            <!-- Divider -->
            <div class="divider-section">
              <div class="divider-line"></div>
              <span class="divider-text">OR</span>
              <div class="divider-line"></div>
            </div>

            <!-- Social login options -->
            <div class="social-login-section">
              <button class="social-button">
                <img class="social-icon google-icon" alt="Google logo" src="/social-media-logo.svg" />
                <span class="social-text">Continue with Google</span>
              </button>
              
              <button class="social-button">
                <img class="social-icon apple-icon" alt="Apple logo" src="/social-media-logo-1.svg" />
                <span class="social-text">Continue with Apple</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Illustration -->
        <img class="illustration" alt="Seeking development" src="templates/lady-scanning.gif" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
